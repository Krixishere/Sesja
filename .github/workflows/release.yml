# Buduje instalatory aplikacji Sesja i publikuje je jako wydanie na GitHubie.
# Uruchom: zmień wersję w app/src-tauri/Cargo.toml i tauri.conf.json, dopisz zmiany
# do CHANGELOG.md, potem: git tag v1.0.1 && git push origin v1.0.1
# Aplikacja sama znajdzie nowe wydanie i zaproponuje aktualizację.
name: Wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Zależności systemowe (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: "Sesja ${{ github.ref_name }}"
          releaseBody: "Zmiany opisane są w CHANGELOG.md. Aplikacja zainstalowana wcześniej zaproponuje tę aktualizację sama."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
