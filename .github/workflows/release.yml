# Automatyczne wydania aplikacji Sesja.
#
# - Każdy push (na dowolny branch): budowanie próbne na Windows, macOS i Linuksie.
#   Gotowe instalatory są do pobrania w zakładce „Artifacts” danego uruchomienia.
# - Push na main z NOWĄ wersją (app/src-tauri/tauri.conf.json, pole "version"),
#   której jeszcze nie wydano: powstaje szkic wydania vX.Y.Z, trzy systemy wgrywają
#   do niego instalatory, a gdy wszystkie się zbudują – wydanie jest publikowane.
#   Zainstalowane aplikacje same zaproponują tę aktualizację.
# - Ręcznie: zakładka Actions → „Wydanie” → Run workflow.
#
# Jak wydać nową wersję: podnieś "version" w tauri.conf.json i Cargo.toml,
# dodaj sekcję "## Sesja X.Y.Z" do CHANGELOG.md, scal do main. Reszta dzieje się sama.
name: Wydanie

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # na main nie przerywamy – mogłoby to uciąć publikowanie wydania
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Wersja i decyzja o wydaniu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Wersja w tauri.conf.json ($VERSION) różni się od Cargo.toml ($CARGO)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RELEASE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            DRAFT=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$DRAFT" = "false" ]; then
              echo "Wydanie v$VERSION jest już opublikowane – tylko budowanie próbne."
            else
              RELEASE=true
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  # Szkic wydania tworzy gh (poprawnie obsługuje polskie znaki w opisie).
  draft:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.d.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        name: Szkic wydania z opisem z CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          # szkice z poprzednich, nieudanych prób – zaczynamy od nowa
          for OLD in $(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$OLD"
          done
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## Sesja " v) == 1) { found=1; next } }
            found { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Poprawki i nowe funkcje." > notes.md
          # numer szkicu bierzemy wprost z odpowiedzi API – lista wydań bywa opóźniona
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" -f name="Sesja $VERSION" \
            -F body=@notes.md -F draft=true --jq .id)
          [ -n "$ID" ] || { echo "::error::Nie udało się utworzyć szkicu wydania $TAG"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, draft]
    # buduje także wtedy, gdy nie ma wydania (draft pominięty)
    if: always() && needs.version.result == 'success' && needs.draft.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ""
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Zależności systemowe (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Budowanie (i wgranie do szkicu wydania)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          # z releaseId tauri-action tylko wgrywa pliki do istniejącego szkicu; bez niego tylko buduje
          releaseId: ${{ needs.draft.outputs.id }}

      - name: Instalatory jako artefakt (do pobrania z tego uruchomienia)
        uses: actions/upload-artifact@v4
        with:
          name: Sesja-${{ needs.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/deb/*.deb

  publish:
    needs: [version, draft, build]
    if: needs.version.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
