name: Testy

on:
  push:
  pull_request:

jobs:
  mod-i-serwery:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Zależności
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Testy moda (Lua)
        run: lua5.4 tests/test_chunks.lua
      - name: Kompletność tłumaczeń
        run: node tests/check_i18n.js
      - name: Testy aplikacji (Rust)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - name: E2E z serwerem w Pythonie
        run: python3 tests/run_e2e.py
      - name: E2E z serwerem na Cloudflare (wrangler dev)
        run: |
          cd server/cloudflare && npm ci
          npx wrangler dev --port 8799 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/ping && break; sleep 1; done
          cd ../.. && RMP_SERVER_URL=http://127.0.0.1:8799 python3 tests/run_e2e.py
      - name: E2E z serwerem centralnym (sesja z linkiem i hasłem)
        run: |
          cd server/cloudflare
          npx wrangler dev --port 8797 --ip 127.0.0.1 --var CENTRAL:1 > /tmp/wrangler-central.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8797/api/ping && break; sleep 1; done
          cd ../..
          test "$(curl -s 'http://127.0.0.1:8797/api/state?room=nieistnieje' | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')" = no_room
          RESP=$(curl -s -X POST http://127.0.0.1:8797/api/rooms -d '{"name":"CI","password":"haslo1"}')
          ROOM=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["room"])')
          ADMIN=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["admin_key"])')
          test "$(curl -s "http://127.0.0.1:8797/api/state?room=$ROOM" | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')" = bad_password
          RMP_SERVER_URL=http://127.0.0.1:8797 RMP_ROOM=$ROOM RMP_PASSWORD=haslo1 RMP_ADMIN=$ADMIN python3 tests/run_e2e.py
          # duży plik (20 MB) – przesyłanie w częściach
          RESP=$(curl -s -X POST http://127.0.0.1:8797/api/rooms -d '{"name":"CI big","password":"haslo1"}')
          ROOM=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["room"])')
          RMP_BIG=20000000 RMP_END=60 RMP_SERVER_URL=http://127.0.0.1:8797 RMP_ROOM=$ROOM RMP_PASSWORD=haslo1 python3 tests/run_e2e.py
      - name: E2E z serwerem wbudowanym w aplikację
        run: |
          cargo build --manifest-path app/src-tauri/Cargo.toml
          RMP_SERVER=rust python3 tests/run_e2e.py
